[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mail-sender-audit"
dynamic = ["version"]
description = "Scan your inbox and unsubscribe from mailing lists, one by one or in bulk. Works with Gmail, Yahoo, iCloud, Fastmail, AOL and any IMAP provider."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kerimdziho" }]
keywords = ["gmail", "imap", "yahoo", "icloud", "unsubscribe", "cli", "mailing-list", "list-unsubscribe", "rfc8058"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    # --- Google auth + Gmail API ---
    "google-api-python-client>=2.140",  # Gmail API client
    "google-auth>=2.34",                # credentials, token refresh
    "google-auth-httplib2>=0.2",        # transport adapter used by the api client
    "google-auth-oauthlib>=1.2",        # InstalledAppFlow (loopback OAuth for desktop apps)
    "oauthlib>=3.2",                    # imported directly to classify flow errors
    "httplib2>=0.22",                   # imported directly to classify transport errors
    # --- Networking and parsing ---
    "httpx>=0.27",                      # RFC 8058 one-click POSTs, token revocation
    "beautifulsoup4>=4.12",             # HTML-body fallback for unsubscribe links
    # --- CLI / UX ---
    "typer>=0.12",                      # subcommands + flags
    "rich>=13.7",                       # progress bars, tables, logging
    "questionary>=2.0",                 # interactive multi-select prompts
    "platformdirs>=4.2",                # per-OS config/data directories
    "keyring>=25",                      # stores IMAP app passwords in the OS keyring
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]
bundle = [
    "pyinstaller>=6.10",  # build standalone executables (see .github/workflows/release.yml)
]

[project.urls]
Homepage = "https://github.com/kerimdziho/mail-sender-audit"
Issues = "https://github.com/kerimdziho/mail-sender-audit/issues"
Changelog = "https://github.com/kerimdziho/mail-sender-audit/blob/main/CHANGELOG.md"

[project.scripts]
mail-sender-audit = "mail_sender_audit.cli:main"

[tool.hatch.version]
path = "src/mail_sender_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_sender_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is the formatter's job; long strings are fine

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# google-auth is only partially typed: calls like Credentials.refresh() count as untyped.
module = ["mail_sender_audit.auth", "tests.test_auth", "test_auth"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# These packages ship no (or incomplete) type information.
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
    "google_auth_httplib2.*",
    "httplib2.*",
    "oauthlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
